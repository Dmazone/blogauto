name: Scheduled Pages Rebuild

# 발행 시간대 커버 (KST 05:00~08:00 = UTC 20:00~23:00)
# 하루 최대 7개 포스트 30분 간격 순차 공개
# 05:00→20:00, 05:30→20:30, 06:00→21:00, 06:30→21:30, 07:00→22:00, 07:30→22:30, 08:00→23:00
on:
  schedule:
    - cron: "0,30 20 * * *"
    - cron: "0,30 21 * * *"
    - cron: "0,30 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "https://dmazone.github.io/blogauto/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
