baseURL = "https://dmazone.github.io/blogauto/"
languageCode = "ko-KR"
title = "트렌드줌 | 최신 트렌드 모음"
theme = "PaperMod"
defaultContentLanguage = "ko"
hasCJKLanguage = true
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[services]
  [services.googleAnalytics]
    ID = "G-Y39GG6G0N2"

[params]
  author = "트렌드줌"
  description = "최신기술·경제·사회·인문·연예·건강·IT기기·부동산·여행·스포츠까지. 오늘의 트렌드를 한눈에."
  keywords = ["최신기술동향", "경제이슈", "사회이슈", "IT기기", "한국부동산", "세계여행지", "건강정보", "스포츠뉴스", "연예이슈", "인문학"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  firebaseDbUrl = ""
  comments = true

  [params.homeInfoParams]
    Title = "오늘의 트렌드, 여기서 다 본다"
    Content = "기술·경제·사회·건강·연예·스포츠·부동산·여행·인문·IT기기\n매일 최신 트렌드 10편이 업데이트됩니다"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

