{{ if .Site.Params.walineServerUrl }}
<div id="waline-comment"></div>
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
  init({
    el: '#waline-comment',
    serverURL: '{{ .Site.Params.walineServerUrl }}',
    lang: 'ko',
    login: 'enable',
    dark: 'auto',
    pageSize: 20,
    comment: true,
    reaction: ['👍', '❤️', '😂', '🎉'],
    requiredMeta: [],
    wordLimit: [0, 1000],
    imageUploader: false,
    highlighter: false,
    texRenderer: false,
  });
</script>
{{ end }}
