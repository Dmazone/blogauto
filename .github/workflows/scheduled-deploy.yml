name: Scheduled Pages Rebuild

# 발행 시간대 전체 커버 (KST 07:10~09:20 = UTC 22:10~00:20)
# KST 07:10~07:50 = UTC 22:10~22:50 → 포스트 1~5 순차 공개
# KST 08:00~08:50 = UTC 23:00~23:50 → 포스트 6~10 순차 공개
# KST 09:10~09:20 = UTC 00:10~00:20 → 전체 확인 재빌드
on:
  schedule:
    - cron: "10,20,30,40,50 22 * * *"
    - cron: "0,10,20,30,40,50 23 * * *"
    - cron: "10,20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://dmazone.github.io/blogauto/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
