name: Daily Blog Auto Publisher

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      sections:
        description: "특정 섹션만 실행 (쉼표 구분, 예: economy,health) — 비우면 전체"
        required: false
        default: ""
      from_index:
        description: "N번째 섹션부터 재개 (1-based, 기본 1)"
        required: false
        default: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate all 10 sections (no delay — publishDate handles staggering)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_BASE_URL: ${{ secrets.BLOG_BASE_URL }}
          SNS_DEPLOY_WAIT_SEC: ${{ secrets.SNS_DEPLOY_WAIT_SEC }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_THREADS_USER_ID: ${{ secrets.META_THREADS_USER_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          SECTIONS="${{ github.event.inputs.sections }}"
          FROM="${{ github.event.inputs.from_index }}"

          if [ -n "$SECTIONS" ]; then
            node scripts/daily_runner.js --only "$SECTIONS"
          elif [ -n "$FROM" ] && [ "$FROM" != "1" ]; then
            node scripts/daily_runner.js --from "$FROM"
          else
            node scripts/daily_runner.js
          fi

      # 생성 완료 후 즉시 Pages 첫 배포 (09:00 글 공개)
      - name: Setup Hugo for initial deploy
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo (09:00 기사 공개)
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
