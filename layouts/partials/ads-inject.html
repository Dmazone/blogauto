{{- if .IsPage -}}
<!-- 광고 외부 스크립트 로드 -->
<script async src="//ads.tenping.kr/scripts/adsbytenping.min.js"></script>
<script type="text/javascript" src="//t1.daumcdn.net/kas/static/ba.min.js" async></script>
<script src="https://ads-partners.coupang.com/g.js"></script>

<script>
(function() {
  var TENPING_CLIENT = 'BdnhcMfPBvtcqWy4TeF3452t47SWFwraO4StFWXx1U%2fSBFm9k9OQo1uJHpkxwqxi';
  var TENPING_TYPES = [
    '1LawCE8FqKOhetXZhMopsQ%3d%3d',
    'UD8Mia8gyIoT5Z2MT6VB3Q%3d%3d',
    '1LawCE8FqKOhetXZhMopsQ%3d%3d',
    'UD8Mia8gyIoT5Z2MT6VB3Q%3d%3d',
    '1LawCE8FqKOhetXZhMopsQ%3d%3d',
    'UD8Mia8gyIoT5Z2MT6VB3Q%3d%3d',
  ];

  function makeTenping(displayType) {
    var w = document.createElement('div');
    w.className = 'ad-unit ad-tenping';
    w.style.cssText = 'margin:28px auto;max-width:768px;text-align:center;';
    var el = document.createElement('tenping');
    el.className = 'adsbytenping';
    el.style.cssText = 'width:100%;max-width:768px;margin:0px auto;display:block;';
    el.setAttribute('tenping-ad-display-type', displayType);
    el.setAttribute('tenping-ad-client', TENPING_CLIENT);
    w.appendChild(el);
    return w;
  }

  function injectAds() {
    var content = document.querySelector('.post-content');
    if (!content) return;
    var h2s = content.querySelectorAll('h2');
    if (h2s.length === 0) return;

    /* H2 2개마다 텐핑 광고 1개 삽입 (index 1, 3, 5...) */
    var slotIdx = 0;
    for (var i = 1; i < h2s.length && slotIdx < TENPING_TYPES.length; i += 2) {
      var node = makeTenping(TENPING_TYPES[slotIdx]);
      h2s[i].parentNode.insertBefore(node, h2s[i].nextSibling);
      slotIdx++;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectAds);
  } else {
    injectAds();
  }
})();
</script>
{{- end -}}
