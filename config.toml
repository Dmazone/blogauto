baseURL = "https://dmazone.github.io/blogauto/"
languageCode = "ko-KR"
title = "Claude Code 블로그 | 한국어 완전 가이드"
theme = "PaperMod"
defaultContentLanguage = "ko"
hasCJKLanguage = true
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[params]
  author = "Claude Code 블로그"
  description = "Claude Code 입문부터 자동화까지. 기초편(설치·CLAUDE.md·MCP·Hooks)과 활용편(Subagents·자동화·GitHub Pages 배포)으로 단계별 학습하세요."
  keywords = ["Claude Code", "claude code 설치", "claude code 사용법", "claude code 자동화", "claude code mcp", "claude code hooks", "AI 개발 도구"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  firebaseDbUrl = ""
  comments = false

  [params.homeInfoParams]
    Title = "Claude Code, 제대로 배워보자"
    Content = "**기초편(Track A)** — 설치·CLAUDE.md·MCP·Hooks까지, 처음 시작하는 분을 위한 입문 가이드\n**활용편(Track B)** — Subagents·자동화·GitHub Pages 배포까지, 생산성을 끌어올리는 실전 레시피"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

[menu]
  [[menu.main]]
    identifier = "track-a"
    name = "기초편"
    url = "/posts/track-a/"
    weight = 10
  [[menu.main]]
    identifier = "track-b"
    name = "활용편"
    url = "/posts/track-b/"
    weight = 20

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "monokai"
