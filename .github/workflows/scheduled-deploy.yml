name: Scheduled Pages Rebuild

# 발행 시간대 커버 (KST 07:00~09:00 = UTC 22:00~00:00)
# 하루 5개 포스트 30분 간격 순차 공개
# 07:00→22:00, 07:30→22:30, 08:00→23:00, 08:30→23:30, 09:00→00:00
on:
  schedule:
    - cron: "0,30 22 * * *"
    - cron: "0,30 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.1"
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://dmazone.github.io/blogauto/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
