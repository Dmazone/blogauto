{{- define "main" }}
<div style="text-align:center;padding:60px 20px 80px;max-width:600px;margin:0 auto;">
  <div style="font-size:96px;font-weight:900;letter-spacing:-4px;opacity:0.12;line-height:1;">404</div>
  <h1 style="font-size:clamp(22px,4vw,32px);font-weight:800;margin:-20px 0 16px;letter-spacing:-0.02em;">페이지를 찾을 수 없습니다</h1>
  <p style="font-size:16px;color:var(--secondary);line-height:1.7;margin:0 0 32px;">
    요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있습니다.<br>
    아래 메뉴에서 원하는 콘텐츠를 찾아보세요.
  </p>
  <a href="/" style="display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:15px;padding:12px 28px;border-radius:10px;text-decoration:none;margin-bottom:40px;">홈으로 돌아가기</a>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:480px;margin:0 auto;">
    {{- range .Site.Menus.main }}
    <a href="{{ .URL }}" style="display:block;padding:9px 6px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;color:var(--primary);background:var(--entry);transition:background 0.15s;">{{ .Name }}</a>
    {{- end }}
  </div>
</div>
{{- end }}{{/* end main */ -}}
