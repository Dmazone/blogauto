{{- if .IsPage -}}
<!-- 광고 외부 스크립트 로드 -->
<script async src="//ads.tenping.kr/scripts/adsbytenping.min.js"></script>
<script type="text/javascript" src="//t1.daumcdn.net/kas/static/ba.min.js" async></script>
<script src="https://ads-partners.coupang.com/g.js"></script>

<script>
(function() {
  var TENPING_CLIENT = 'BdnhcMfPBvtcqWy4TeF3452t47SWFwraO4StFWXx1U%2fSBFm9k9OQo1uJHpkxwqxi';

  function makeTenping(displayType) {
    var w = document.createElement('div');
    w.className = 'ad-unit ad-tenping';
    w.style.cssText = 'margin:28px auto;max-width:768px;text-align:center;';
    var el = document.createElement('tenping');
    el.className = 'adsbytenping';
    el.style.cssText = 'width:100%;max-width:768px;margin:0px auto;display:block;';
    el.setAttribute('tenping-ad-display-type', displayType);
    el.setAttribute('tenping-ad-client', TENPING_CLIENT);
    w.appendChild(el);
    return w;
  }

  function makeAdfit(dan, width, height) {
    var w = document.createElement('div');
    w.className = 'ad-unit ad-adfit';
    w.style.cssText = 'margin:28px auto;max-width:768px;text-align:center;';
    var ins = document.createElement('ins');
    ins.className = 'kakao_ad_area';
    ins.style.display = 'block';
    ins.setAttribute('data-ad-unit', dan);
    ins.setAttribute('data-ad-width', String(width));
    ins.setAttribute('data-ad-height', String(height));
    w.appendChild(ins);
    return w;
  }

  function makeCoupang() {
    var w = document.createElement('div');
    w.className = 'ad-unit ad-coupang';
    w.style.cssText = 'margin:28px auto;max-width:768px;text-align:center;overflow:hidden;';
    // PartnersCoupang.G는 currentScript 기준으로 주입 → script 태그로 직접 실행
    var s = document.createElement('script');
    s.textContent = 'if(window.PartnersCoupang){new window.PartnersCoupang.G({"id":999595,"template":"carousel","trackingCode":"AF8691300","width":"680","height":"140","tsource":""});}';
    w.appendChild(s);
    return w;
  }

  function injectAds() {
    var content = document.querySelector('.post-content');
    if (!content) return;
    var h2s = content.querySelectorAll('h2');
    if (h2s.length === 0) return;

    // 광고 순서: AdFit → 텐핑 → 쿠팡 × 3세트 (H2 2개마다 1개)
    var builders = [
      function() { return makeAdfit('DAN-rQKAp2HPhLvIgyeA', 320, 100); },
      function() { return makeTenping('1LawCE8FqKOhetXZhMopsQ%3d%3d'); },
      function() { return makeCoupang(); },
      function() { return makeAdfit('DAN-rQKAp2HPhLvIgyeA', 320, 100); },
      function() { return makeTenping('UD8Mia8gyIoT5Z2MT6VB3Q%3d%3d'); },
      function() { return makeCoupang(); },
      function() { return makeAdfit('DAN-rQKAp2HPhLvIgyeA', 320, 100); },
      function() { return makeTenping('1LawCE8FqKOhetXZhMopsQ%3d%3d'); },
      function() { return makeCoupang(); },
    ];

    /* H2 2개마다 광고 1개 삽입 (index 1, 3, 5...) */
    var builderIndex = 0;
    for (var i = 1; i < h2s.length && builderIndex < builders.length; i += 2) {
      var node = builders[builderIndex]();
      h2s[i].parentNode.insertBefore(node, h2s[i].nextSibling);
      builderIndex++;
    }

    // 애드핏 재호출 (동적 생성 ins 태그 활성화)
    if (window.kakaoAdFit && typeof window.kakaoAdFit.display === 'function') {
      window.kakaoAdFit.display();
    }
    // 텐핑 재호출
    if (typeof window.tp_adsbytenpingInit === 'function') {
      window.tp_adsbytenpingInit();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectAds);
  } else {
    injectAds();
  }
})();
</script>
{{- end -}}
